<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="css/todo.css">
</head>
<body>
    <main>
        <h1>To-Do List</h1>

        <form id="todo-form">
            <label for="todo-input">New task:</label>
            <input type="text" id="todo-input" name="todo-input" placeholder="e.g. Buy groceries" required autocomplete="off">
            <button type="submit">Add</button>
        </form>

        <ul id="todo-list"></ul>

        <p id="todo-empty">No tasks yet. Add one above to get started.</p>
    </main>

    <script src="js/todo.js"></script>
</body>
</html>
