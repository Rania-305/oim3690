<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rania Ishoof | Personal Homepage</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                font-family: 'Segoe UI', Arial, sans-serif;
                line-height: 1.6;
                color: #2b2b2b;
            }

            header,
            main,
            footer {
                max-width: 900px;
                margin: 0 auto;
                padding: 1.5rem 1rem;
            }

            header {
                text-align: center;
            }

            header img {
                border-radius: 50%;
            }

            img {
                max-width: 100%;
                height: auto;
                display: block;
            }

            section {
                margin-bottom: 2rem;
            }

            section img {
                margin: 0 auto;
                border-radius: 8px;
            }

            footer {
                text-align: center;
            }

            @media (max-width: 600px) {
                header,
                main,
                footer {
                    padding: 1rem;
                }

                h1 {
                    font-size: 1.6rem;
                }
            }
        </style>
    </head>

    <body>
        <header>
            <h1>Rania Ishoof</h1>
            <p>Welcome to my homepage. I am a <a href="https://www.babson.edu/">Babson College</a> student interested in learning, creating, and finding practical ways to use technology.</p>
            <img src="IMG_7288.jpeg" width="200" alt="Rania Ishoof" />
        </header>

        <main>
            <section>
                <h2>Things I am interested in</h2>
                <ul>
                    <li>Entrepreneurship</li>
                    <li>Technology and innovation</li>
                    <li>Learning in public</li>
                </ul>
            </section>

            <section>
                <h2>A place I enjoy</h2>
                <img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&amp;fit=crop&amp;w=900&amp;q=80" alt="A bright workspace with a desk and plants" width="900" height="600">
            </section>
        </main>

        <footer>
            <p><a href="https://github.com/Rania-305/oim_3690">Visit my GitHub profile</a></p>
        </footer>
    </body>
</html>
