<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask AI</title>
</head>
<body>
  <h1>Ask AI</h1>
  <div id="chat"></div>
  <textarea id="prompt" placeholder="Ask AI anything..."></textarea>
  <button id="askBtn">Ask</button>

  <script>
    // This page works only on your vercel.app link. Live Server and GitHub Pages
    // cannot run the function in api/ask.js, so there the Ask button fails.

    // Sends your prompt to your own function at /api/ask. The function adds the
    // key and calls the model, so no key appears anywhere on this page.
    async function askAI(prompt) {
      const response = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      if (!response.ok) {
        throw new Error(`Request failed: ${response.status}`);
      }
      const data = await response.json();
      // A model that reasons first puts a reasoning item ahead of the answer,
      // so find the item of type message, then read its text.
      const message = data.output.find(item => item.type === 'message');
      return message.content[0].text;
    }

    const chatEl = document.querySelector('#chat');
    const askBtn = document.querySelector('#askBtn');
    const promptEl = document.querySelector('#prompt');

    // Adds a new question/answer pair to the bottom of the chat and returns
    // the element holding the answer text, so it can be filled in later.
    function addEntry(question) {
      const entry = document.createElement('div');
      entry.className = 'entry';

      const questionEl = document.createElement('p');
      questionEl.className = 'question';
      questionEl.textContent = 'Q: ' + question;

      const answerEl = document.createElement('p');
      answerEl.className = 'answer';
      answerEl.textContent = 'Thinking...';

      entry.append(questionEl, answerEl);
      chatEl.append(entry);
      // Scroll so the newest entry, added at the bottom, is visible.
      entry.scrollIntoView({ block: 'end' });
      return answerEl;
    }

    askBtn.addEventListener('click', async () => {
      const prompt = promptEl.value;
      if (!prompt.trim()) return;
      const answerEl = addEntry(prompt);
      promptEl.value = '';
      // Turn the button off until the answer arrives, so a second click
      // cannot send, and pay for, a second request.
      askBtn.disabled = true;
      try {
        // textContent shows the answer as plain text. innerHTML would run any
        // HTML the model wrote.
        answerEl.textContent = 'A: ' + await askAI(prompt);
      } catch (error) {
        answerEl.textContent = 'Error: ' + error.message;
      } finally {
        // finally runs whether the call worked or failed.
        askBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
