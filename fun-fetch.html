<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programming Joke Generator</title>
    <link rel="stylesheet" href="css/fun-fetch.css">
</head>
<body>
    <main>
        <div class="spotlight"></div>

        <h1>Programming Joke Generator</h1>
        <p>Click the button to fetch a random programming joke.</p>

        <div class="stage-scene" aria-hidden="true">
            <div class="robot">
                <div class="robot-antenna-ball"></div>
                <div class="robot-antenna"></div>
                <div class="robot-head">
                    <div class="robot-eye left"></div>
                    <div class="robot-eye right"></div>
                    <div class="robot-mouth"></div>
                </div>
                <div class="robot-arm left"></div>
                <div class="robot-arm right"></div>
                <div class="robot-body">
                    <div class="robot-screen">HA HA</div>
                </div>
                <div class="robot-leg left"></div>
                <div class="robot-leg right"></div>
            </div>

            <div class="mic-cord"></div>

            <div class="mic">
                <div class="mic-head"></div>
                <div class="mic-grille"></div>
                <div class="mic-body"></div>
            </div>

            <div class="floor-amp"></div>
        </div>

        <button type="button" id="joke-button">Get a Joke</button>

        <section id="result">
            <p id="joke-text">Press the button above to load a joke.</p>
        </section>
    </main>

    <script src="js/fun-fetch.js"></script>
</body>
</html>
